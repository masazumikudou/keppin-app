<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チュウザンくん</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans:    "Inter", "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      --font-mono:    "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;

      --bg-0: #0a0a0a;
      --bg-1: #101012;
      --bg-2: #16161a;

      --line-faint:  #2e2e34;
      --line:        #44444c;
      --line-strong: #5a5a64;

      --fg:          #ededed;
      --fg-muted:    #9a9aa1;
      --fg-faint:    #6a6a72;
      --fg-disabled: #45454c;

      --accent:       oklch(0.70 0.13 55);
      --accent-hover: oklch(0.76 0.13 55);
      --accent-faint: oklch(0.70 0.13 55 / 0.13);
      --accent-line:  oklch(0.70 0.13 55 / 0.34);
      --accent-fg:    #0a0a0a;

      --ok:  oklch(0.75 0.14 150);
      --err: oklch(0.70 0.18 25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-0);
      color: var(--fg);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      padding: 14px 16px;
      background: var(--bg-1);
      border-bottom: 1px solid var(--line-faint);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--fg);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nyuka-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 3px;
      white-space: nowrap;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .nyuka-badge:hover { opacity: 0.8; }

    /* 入荷予定モーダル */
    #nyukaModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); z-index: 2000;
      align-items: center; justify-content: center;
      padding: 16px;
    }
    #nyukaModal.open { display: flex; }
    #nyukaModalBox {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 12px;
      width: 100%; max-width: 480px;
      max-height: 80vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #nyukaModalHeader {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 14px; font-weight: 600; color: var(--fg);
    }
    #nyukaModalClose {
      background: none; border: none; color: var(--fg-muted);
      font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    #nyukaModalClose:hover { color: var(--fg); }
    #nyukaModalBody {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px 18px;
    }
    .nyuka-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--line-faint);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .nyuka-row:last-child { border-bottom: none; }
    .nyuka-sku { color: var(--fg); }
    .nyuka-right { display: flex; gap: 14px; }
    .nyuka-date { color: var(--accent); font-weight: 600; }
    .nyuka-qty  { color: var(--fg-muted); }

    /* 担当者タブ */
    .staff-tabs {
      display: flex;
      flex-wrap: nowrap;
      padding: 10px 16px 0;
      gap: 4px;
      background: var(--bg-1);
      border-bottom: 1px solid var(--line);
    }
    .staff-tab {
      flex: 1;
      min-width: 0;
      text-align: center;
      padding: 7px 4px;
      border-radius: 6px 6px 0 0;
      border: 1px solid var(--line);
      border-bottom: none;
      cursor: pointer;
      font-size: 13px;
      background: var(--bg-0);
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      transition: color 120ms, background 120ms;
    }
    .staff-tab.active {
      background: var(--bg-2);
      color: var(--accent);
      font-weight: 600;
      border-color: var(--accent-line);
      border-bottom: 2px solid var(--bg-2);
      margin-bottom: -1px;
    }

    .content { padding: 16px; }

    /* 店舗タブ */
    .store-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .store-tab {
      padding: 5px 12px;
      border-radius: 5px;
      border: 1px solid var(--line);
      cursor: pointer;
      font-size: 13px;
      background: var(--bg-1);
      color: var(--fg-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 120ms, background 120ms, border-color 120ms;
    }
    .store-tab:hover { background: var(--bg-2); color: var(--fg); border-color: var(--line-strong); }
    .store-tab.active { background: var(--accent-faint); color: var(--accent); border-color: var(--accent-line); }
    .store-tab-del { font-size: 12px; line-height: 1; color: var(--fg-faint); cursor: pointer; padding: 0 2px; }
    .store-tab.active .store-tab-del { color: var(--accent); opacity: 0.6; }
    .store-tab-del:hover { color: var(--err); }

    /* 出荷ボタン */
    .btn-ship {
      height: 40px;
      padding: 0 16px;
      background: var(--accent);
      color: var(--accent-fg);
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 12px;
      width: 100%;
      transition: background 120ms;
    }
    .btn-ship:hover { background: var(--accent-hover); }
    .btn-ship:disabled { background: var(--bg-2); color: var(--fg-disabled); border-color: var(--line); cursor: not-allowed; }

    /* 差し戻しモーダル */
    #kekkinModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
    #kekkinModal.open { display: flex; }
    #kekkinModalBox {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px 20px;
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    #kekkinModalBox h2 { font-size: 16px; font-weight: 600; color: var(--fg); margin-bottom: 6px; letter-spacing: -0.01em; }
    #kekkinModalBox p { font-size: 13px; color: var(--fg-muted); margin-bottom: 18px; }
    #kekkinQr { margin: 0 auto 18px; width: 180px; height: 180px; }
    #kekkinQr canvas, #kekkinQr img { width: 180px !important; height: 180px !important; }
    .kekkin-btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
    #kekkinProceedBtn {
      flex: 1;
      height: 40px;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms;
    }
    #kekkinProceedBtn:hover { background: var(--accent-hover); }
    #kekkinCancelBtn {
      height: 40px;
      padding: 0 18px;
      background: transparent;
      color: var(--fg-muted);
      border: 1px solid var(--line);
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
    }
    #kekkinCancelBtn:hover { background: var(--bg-2); border-color: var(--line-strong); color: var(--fg); }
    input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }

    .badge-ok { color: var(--ok); font-weight: bold; }
    .badge-ng { color: var(--err); font-weight: bold; }
    .empty { color: var(--fg-faint); font-size: 14px; padding: 20px 0; }

    /* ── PC：テーブル表示 ── */
    @media (min-width: 768px) {
      .content { padding: 20px; }
      table { width: 100%; border-collapse: collapse; background: var(--bg-1); border: 1px solid var(--line-faint); border-radius: 8px; overflow: hidden; }
      th { background: var(--bg-2); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--fg-faint); letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
      td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line-faint); color: var(--fg); }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: var(--bg-2); }
      .card-list { display: none; }
      .btn-ship { width: auto; }
      .staff-select-wrap { display: none; }
    }

    /* ── スマホ：カード表示 ── */
    @media (max-width: 767px) {
      table { display: none; }
      .card-list { display: flex; flex-direction: column; gap: 8px; }
      .card-item {
        background: var(--bg-1);
        border: 1px solid var(--line-faint);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .card-item.is-ok { border-left: 3px solid var(--ok); }
      .card-item.is-ng { border-left: 3px solid var(--err); }
      .card-chk { flex-shrink: 0; }
      .card-body { flex: 1; }
      .card-sku { font-size: 15px; font-weight: 600; color: var(--fg); font-family: var(--font-mono); }
      .card-meta { font-size: 12px; color: var(--fg-faint); margin-top: 3px; font-family: var(--font-mono); }
      .card-status { font-size: 13px; font-weight: bold; margin-top: 4px; }
      .sum-card {
        background: var(--bg-1);
        border: 1px solid var(--line-faint);
        border-left: 3px solid var(--err);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 8px;
      }
      .sum-card-sku { font-size: 15px; font-weight: 600; color: var(--fg); font-family: var(--font-mono); }
      .sum-card-meta { font-size: 12px; color: var(--fg-faint); margin-top: 3px; font-family: var(--font-mono); }
      .staff-tabs { display: none; }
      .staff-select-wrap {
        display: block;
        padding: 10px 16px;
        background: var(--bg-1);
        border-bottom: 1px solid var(--line);
      }
      .store-tabs { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; }
      .store-tabs::-webkit-scrollbar { display: none; }
      .store-tab { flex-shrink: 0; scroll-snap-align: start; }
    }
  </style>
</head>
<body>

<h1>チュウザンくん{% if nyuka_badge %}<span class="nyuka-badge" style="background:{{ nyuka_badge.bg }}; color:{{ nyuka_badge.text }};" onclick="openNyukaModal()">入荷予定 {{ nyuka_badge.date }} 更新</span>{% endif %}</h1>

<!-- 入荷予定モーダル -->
<div id="nyukaModal" onclick="if(event.target===this)closeNyukaModal()">
  <div id="nyukaModalBox">
    <div id="nyukaModalHeader">
      <span>入荷予定一覧</span>
      <button id="nyukaModalClose" onclick="closeNyukaModal()">✕</button>
    </div>
    <div id="nyukaModalBody"></div>
  </div>
</div>
<div class="staff-tabs">
  {% for name in staff_list %}
  <div class="staff-tab" id="tab-{{ name }}" onclick="selectStaff('{{ name }}')">{{ name }}<span id="tabdate-{{ name }}" style="font-size:11px; color:var(--fg-faint); margin-left:3px;"></span></div>
  {% endfor %}
</div>
<div class="staff-select-wrap">
  <select id="staff-select" onchange="selectStaff(this.value)"
    style="width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--line); border-radius:6px; background:var(--bg-2); color:var(--fg); appearance:auto;">
    {% for name in staff_list %}
    <option value="{{ name }}">{{ name }}</option>
    {% endfor %}
  </select>
</div>
<div class="content" id="content"></div>

<!-- 差し戻しモーダル -->
<div id="kekkinModal">
  <div id="kekkinModalBox">
    <h2>TNアプリへ差し戻し</h2>
    <p id="kekkinModalMsg"></p>
    <div id="kekkinQr"></div>
    <div class="kekkin-btn-row">
      <button id="kekkinCancelBtn" onclick="closeKekkinModal()">キャンセル</button>
      <button id="kekkinProceedBtn"></button>
    </div>
  </div>
</div>

<script>
  const records = {{ records | tojson }};
  const staffList = {{ staff_list | tojson }};
  const TN_APP_URL = {{ tn_app_url | tojson }};
  const nyuka = {{ nyuka | tojson }};

  let currentStaff = null;
  let currentStore = null;


  function isMobile() { return window.innerWidth < 768; }

  function renderStaffTabs() {
    staffList.forEach(name => {
      const tab = document.getElementById(`tab-${name}`);
      if (!tab) return;
      tab.classList.toggle('active', name === currentStaff);
      const staffRecs = records.filter(r => (r['担当者名'] || r.staff_name) === name);
      if (!staffRecs.length) return;
      const latest = staffRecs.reduce((a, b) =>
        (a['日付'] || a.date || '') >= (b['日付'] || b.date || '') ? a : b
      );
      const d = latest['日付'] || latest.date || '';
      const dateEl = document.getElementById(`tabdate-${name}`);
      if (dateEl && d) {
        const p = d.split('-');
        dateEl.textContent = `${parseInt(p[1])}/${parseInt(p[2])}`;
      }
    });
  }

  function selectStaff(name) {
    currentStaff = name;
    currentStore = '合計';
    const sel = document.getElementById('staff-select');
    if (sel) sel.value = name;
    renderStaffTabs();
    renderContent();
  }

  function selectStore(name) {
    currentStore = name;
    renderContent();
  }

  function renderContent() {
    const staffRecords = records.filter(r => (r['担当者名'] || r.staff_name) === currentStaff);

    // 店舗＋日付の複合キーで重複排除
    const storeKeySet = new Set(staffRecords.map(r => {
      const name = r['店舗名'] || r.store_name || '';
      const date = r['日付'] || r.date || '';
      return name ? `${name}|||${date}` : '';
    }).filter(Boolean));
    const storeKeys = ['合計', ...storeKeySet];

    const storeTabs = storeKeys.map(key => {
      if (key === '合計') return `<div class="store-tab ${currentStore === '合計' ? 'active' : ''}" onclick="selectStore('合計')">合計</div>`;
      const [sName, sDate] = key.split('|||');
      let label = sName;
      if (sDate) { const p = sDate.split('-'); label += ` ${parseInt(p[1])}/${parseInt(p[2])}`; }
      const safeKey = key.replace(/'/g, "\\'");
      const delBtn = `<span class="store-tab-del" onclick="event.stopPropagation(); deleteStore('${safeKey}')">✕</span>`;
      return `<div class="store-tab ${currentStore === key ? 'active' : ''}" onclick="selectStore('${safeKey}')">${label}${delBtn}</div>`;
    }).join('');

    let bodyHtml = '';

    if (currentStore === '合計') {
      const shortage = staffRecords.filter(r => r['欠品'] === '✖' || (r.is_shortage && r.is_shortage !== '0'));
      const grouped = {};
      shortage.forEach(r => {
        const key = `${r['品番'] || r.sku}__${r['色'] || r.color}`;
        if (!grouped[key]) grouped[key] = { sku: r['品番'] || r.sku, color: r['色'] || r.color, qty: 0, stores: [] };
        grouped[key].qty += parseInt(r['数量'] || r.quantity || 0);
        const s = r['店舗名'] || r.store_name;
        if (!grouped[key].stores.includes(s)) grouped[key].stores.push(s);
      });
      const rows = Object.values(grouped).sort((a, b) => a.sku.localeCompare(b.sku));

      if (rows.length === 0) {
        bodyHtml = '<p class="empty">欠品データはありません</p>';
      } else {
        // PCテーブル
        const pcTable = `<table>
          <thead><tr><th>品番</th><th>色</th><th>合計数量</th><th>欠品店舗</th></tr></thead>
          <tbody>${rows.map(r =>
            `<tr>
              <td style="font-family:var(--font-mono)">${r.sku}</td>
              <td style="font-family:var(--font-mono)">${r.color}</td>
              <td style="font-family:var(--font-mono)">${r.qty}</td>
              <td>${r.stores.join('・')}</td>
            </tr>`
          ).join('')}</tbody>
        </table>`;
        // スマホカード
        const spCards = `<div class="card-list">${rows.map(r =>
          `<div class="sum-card">
            <div class="sum-card-sku">❌ ${r.sku} <span style="color:var(--fg-faint);font-weight:normal;">${r.color}</span></div>
            <div class="sum-card-meta">合計 ${r.qty}個　｜　${r.stores.join('・')}</div>
          </div>`
        ).join('')}</div>`;
        bodyHtml = pcTable + spCards;
      }

    } else {
      const [filterName, filterDate] = currentStore.split('|||');
      const storeId = currentStore.replace(/[|\s・]/g, '_');
      const storeRecords = staffRecords
        .filter(r => (r['店舗名'] || r.store_name) === filterName && (r['日付'] || r.date || '') === (filterDate || ''))
        .sort((a, b) => (b['日付'] || b.date || '').localeCompare(a['日付'] || a.date || ''));

      if (storeRecords.length === 0) {
        bodyHtml = '<p class="empty">データはありません</p>';
      } else {
        // PCテーブル
        const pcTable = `<table>
          <thead><tr><th></th><th>日付</th><th>品番</th><th>色</th><th>数量</th><th>状態</th><th>入荷予定</th></tr></thead>
          <tbody>${storeRecords.map(r => {
            const isSh = r['欠品'] === '✖' || r.is_shortage == 1;
            const d = r['日付'] || r.date || '';
            const dateStr = d ? `${parseInt(d.split('-')[1])}/${parseInt(d.split('-')[2])}` : '';
            const sku = r['品番'] || r.sku || '';
            const color = r['色'] || r.color || '';
            const qty = r['数量'] || r.quantity || 0;
            const nyukaInfo = nyuka[sku] || null;
            const nyukaCell = nyukaInfo
              ? `<span style="color:var(--accent);font-weight:bold;font-family:var(--font-mono)">${nyukaInfo.date}</span><span style="color:var(--fg-faint);font-size:11px;margin-left:4px;font-family:var(--font-mono)">${nyukaInfo.qty}個</span>`
              : '<span style="color:var(--fg-faint)">-</span>';
            const chk = isSh
              ? `<input type="checkbox" class="ship-chk ship-chk-${storeId}" value="${r.id || r['id']}" data-sku="${sku}" data-color="${color}" data-qty="${qty}">`
              : '';
            return `<tr id="row-${r.id || r['id']}">
              <td>${chk}</td>
              <td style="font-family:var(--font-mono)">${dateStr}</td>
              <td style="font-family:var(--font-mono)">${sku}</td>
              <td style="font-family:var(--font-mono)">${color}</td>
              <td style="font-family:var(--font-mono)">${qty}</td>
              <td class="${isSh ? 'badge-ng' : 'badge-ok'}">${isSh ? '❌欠品' : '✅完納'}</td>
              <td>${nyukaCell}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>`;

        // スマホカード
        const spCards = `<div class="card-list">${storeRecords.map(r => {
          const isSh = r['欠品'] === '✖' || r.is_shortage == 1;
          const d = r['日付'] || r.date || '';
          const dateStr = d ? `${parseInt(d.split('-')[1])}/${parseInt(d.split('-')[2])}` : '';
          const sku = r['品番'] || r.sku || '';
          const color = r['色'] || r.color || '';
          const qty = r['数量'] || r.quantity || 0;
          const nyukaInfo = nyuka[sku] || null;
          const chk = isSh
            ? `<input type="checkbox" class="ship-chk ship-chk-${storeId}" value="${r.id || r['id']}" data-sku="${sku}" data-color="${color}" data-qty="${qty}">`
            : '<span style="width:18px;display:inline-block;"></span>';
          return `<div class="card-item ${isSh ? 'is-ng' : 'is-ok'}">
            <div class="card-chk">${chk}</div>
            <div class="card-body">
              <div class="card-sku">${sku}</div>
              <div class="card-meta">${color}　｜　${qty}個　｜　${dateStr}${nyukaInfo ? `　｜　入荷 <span style="color:var(--accent);font-weight:bold;">${nyukaInfo.date}</span> ${nyukaInfo.qty}個` : ''}</div>
              <div class="card-status ${isSh ? 'badge-ng' : 'badge-ok'}">${isSh ? '❌欠品' : '✅完納'}</div>
            </div>
          </div>`;
        }).join('')}</div>`;

        bodyHtml = pcTable + spCards +
          `<button class="btn-ship" onclick="shipSelected('${storeId}')">選択した品番を出荷済みにする</button>`;
      }
    }

    document.getElementById('content').innerHTML = `
      <div class="store-tabs">${storeTabs}</div>
      ${bodyHtml}
    `;
  }

  let _kekkinPending = null;

  async function shipSelected(storeId) {
    const checked = [...document.querySelectorAll(`.${CSS.escape('ship-chk-' + storeId)}:checked`)];
    if (checked.length === 0) { alert('出荷する品番を選択してください'); return; }

    const [filterName, filterDate] = currentStore.split('|||');
    const storeRecs = records.filter(r =>
      (r['担当者名'] || r.staff_name) === currentStaff &&
      (r['店舗名']   || r.store_name) === filterName
    );
    const first     = storeRecs[0] || {};
    const storeName = first.store_name || first['店舗名'] || filterName;
    const staffName = first.staff_name || first['担当者名'] || currentStaff;
    const storeCode = first.store_code || '';
    const today     = new Date().toISOString().split('T')[0];

    const ids   = checked.map(c => c.value);
    const items = checked.map(c => ({
      sku:      c.dataset.sku,
      color:    c.dataset.color,
      quantity: parseInt(c.dataset.qty || '0'),
    }));

    const base = TN_APP_URL || window.location.origin.replace(/:8090$/, ':8080');
    const params = new URLSearchParams({
      from:  'kekkin',
      store: storeName,
      staff: staffName,
      code:  storeCode,
      date:  today,
      items: JSON.stringify(items),
    });
    const tnUrl = `${base}/order?${params.toString()}`;

    _kekkinPending = { ids, storeName, staffName, storeCode, today, items, tnUrl };
    showKekkinModal(tnUrl);
  }

  function showKekkinModal(tnUrl) {
    const modal = document.getElementById('kekkinModal');
    const qrDiv = document.getElementById('kekkinQr');
    const msg   = document.getElementById('kekkinModalMsg');
    const btn   = document.getElementById('kekkinProceedBtn');

    if (isMobile()) {
      qrDiv.style.display = 'none';
      msg.textContent = 'TNアプリへ差し戻しを行います';
      btn.textContent = 'TNアプリを開く';
      btn.onclick = async () => {
        await execShip(null);
      };
    } else {
      qrDiv.style.display = 'block';
      qrDiv.innerHTML = '';
      new QRCode(qrDiv, { text: tnUrl, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
      msg.textContent = 'スマホの場合はQRを読み取ってください';
      btn.textContent = 'このまま進める（PC）';
      btn.onclick = async () => {
        const win = window.open('', '_blank');
        await execShip(win);
      };
    }

    modal.classList.add('open');
  }

  function closeKekkinModal() {
    document.getElementById('kekkinModal').classList.remove('open');
    _kekkinPending = null;
  }

  async function execShip(win) {
    if (!_kekkinPending) return;
    const { ids, storeName, staffName, storeCode, today, items, tnUrl } = _kekkinPending;

    document.getElementById('kekkinProceedBtn').disabled = true;
    document.getElementById('kekkinProceedBtn').textContent = '処理中...';

    const resp = await fetch('/api/shortage/ship', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ ids, store_name: storeName, staff_name: staffName, store_code: storeCode, date: today, items }),
    });
    const data = await resp.json();

    closeKekkinModal();

    if (data.success) {
      ids.forEach(id => {
        const rec = records.find(r => String(r.id || r['id']) === String(id));
        if (rec) { rec.is_shortage = 0; rec['欠品'] = '〇'; }
      });
      if (win) {
        win.location.href = tnUrl;
      } else {
        window.location.href = tnUrl;
      }
      renderContent();
    } else {
      if (win) win.close();
      alert('エラーが発生しました: ' + (data.error || ''));
    }
  }

  async function deleteStore(storeKey) {
    const [storeName, storeDate] = storeKey.split('|||');
    const p = (storeDate || '').split('-');
    const dateLabel = storeDate ? ` ${parseInt(p[1])}/${parseInt(p[2])}` : '';
    if (!confirm(`「${storeName}${dateLabel}」のデータを削除しますか？`)) return;
    const resp = await fetch('/api/shortage/delete_store', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ store_name: storeName, staff_name: currentStaff, date: storeDate || '' }),
    });
    const data = await resp.json();
    if (data.success) {
      for (let i = records.length - 1; i >= 0; i--) {
        const r = records[i];
        const matchStore = (r.store_name || r['店舗名']) === storeName;
        const matchDate  = !storeDate || (r['日付'] || r.date || '') === storeDate;
        const matchStaff = (r.staff_name || r['担当者名']) === currentStaff;
        if (matchStore && matchDate && matchStaff) records.splice(i, 1);
      }
      currentStore = '合計';
      renderContent();
    } else {
      alert('削除に失敗しました: ' + (data.error || ''));
    }
  }

  if (staffList.length > 0) selectStaff(staffList[0]);

  function openNyukaModal() {
    document.body.style.overflow = 'hidden';
    const entries = Object.entries(nyuka)
      .sort((a, b) => {
        const [am, ad] = a[1].date.split('/').map(Number);
        const [bm, bd] = b[1].date.split('/').map(Number);
        return (am * 31 + ad) - (bm * 31 + bd);
      });
    const body = document.getElementById('nyukaModalBody');
    if (entries.length === 0) {
      body.innerHTML = '<p style="color:var(--fg-faint);padding:16px 0;text-align:center;">データなし</p>';
    } else {
      body.innerHTML = entries.map(([sku, info]) =>
        `<div class="nyuka-row">
          <span class="nyuka-sku">${sku}</span>
          <span class="nyuka-right">
            <span class="nyuka-qty">${info.qty}個</span>
            <span class="nyuka-date">${info.date}</span>
          </span>
        </div>`
      ).join('');
    }
    document.getElementById('nyukaModal').classList.add('open');
  }

  function closeNyukaModal() {
    document.getElementById('nyukaModal').classList.remove('open');
    document.body.style.overflow = '';
  }
</script>
</body>
